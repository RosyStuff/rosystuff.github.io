<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OS Hub - Verified Loader</title>
    <style>
        body, html { margin: 0; height: 100%; background: #121212; color: #fff; font-family: sans-serif; overflow: hidden; }
        #menu { padding: 15px; background: #1f1f1f; display: flex; gap: 10px; align-items: center; border-bottom: 2px solid #3583e4; }
        #view-container { height: calc(100vh - 60px); width: 100%; position: relative; }
        iframe { width: 100%; height: 100%; border: none; display: none; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .warning { color: #ff4d4d; font-weight: bold; }
        button { background: #3583e4; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body onload="verifyBrowser()">

<div id="verifyOverlay" class="overlay">
    <h2>System Verification</h2>
    <p id="statusMsg">Analyzing browser compatibility...</p>
    <div id="actionArea"></div>
</div>

<div id="menu">
    <strong>Select OS:</strong>
    <select id="osSelect">
        <option value="https://www.onworks.net">Zorin OS</option>
        <option value="https://www.onworks.net">Ubuntu</option>
        <option value="https://www.onworks.net">Kali Linux</option>
    </select>
    <button onclick="launchOS()">Launch System</button>
</div>

<div id="view-container">
    <iframe id="osFrame"></iframe>
</div>

<script>
    function verifyBrowser() {
        const ua = navigator.userAgent;
        const status = document.getElementById('statusMsg');
        const action = document.getElementById('actionArea');
        
        // Detect Chromium, Firefox, and Mobile
        const isChrome = /Chrome/.test(ua) && /Google Inc/.test(navigator.vendor);
        const isFirefox = /Firefox/.test(ua);
        const isMobile = /Mobi|Android/i.test(ua);

        if (isMobile) {
            status.innerHTML = "<span class='warning'>Mobile Not Supported</span><br>OnWorks requires a desktop keyboard and mouse.";
        } else if (isChrome || isFirefox) {
            status.innerHTML = "Browser Verified: Compatible";
            action.innerHTML = '<button onclick="closeOverlay()">Enter Loader</button>';
        } else {
            status.innerHTML = "<span class='warning'>Unknown Browser Detected</span><br>Use Chrome or Edge for the best experience.";
            action.innerHTML = '<button onclick="closeOverlay()">Continue Anyway</button>';
        }
    }

    function closeOverlay() {
        document.getElementById('verifyOverlay').style.display = 'none';
    }

    function launchOS() {
        const url = document.getElementById('osSelect').value;
        // Opens the OnWorks page in a new tab to start the session handshake
        window.open(url, '_blank');
        alert("Session triggered! Once it starts, use 'Open Frame in New Tab' to get your final URL for the iframe.");
    }
</script>
</body>
</html>
