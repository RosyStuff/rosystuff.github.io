<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Universal OS Hub - No Redirect</title>
    <script src="https://unpkg.com"></script>
    <script type="module" src="https://unpkg.com"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
        #nav { height: 50px; background: #1a1a1a; display: flex; align-items: center; padding: 0 15px; border-bottom: 2px solid #3583e4; }
        button { background: #3583e4; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        iframe { width: 100%; height: calc(100vh - 52px); border: none; }
    </style>
</head>
<body>

<div id="nav">
    <button onclick="boot('zorinos')">Launch Zorin OS</button>
    <span style="margin-left:10px; color:#888; font-size:12px;">(Wait for the 'Starting' tab to close)</span>
</div>

<!-- Note the is="x-frame-bypass" attribute -->
<iframe id="osView" is="x-frame-bypass"></iframe>

<script>
    function boot(os) {
        // Step 1: Trigger the session in a popup so OnWorks records your IP
        const trigger = window.open(`https://www.onworks.net{os}-online`, '_blank', 'width=100,height=100');
        
        // Step 2: Attempt to load the noVNC client directly into the bypassed frame
        // OnWorks uses sessionx60, x64, or x65 depending on server load
        setTimeout(() => {
            document.getElementById('osView').src = "https://www.onworks.net";
            if(trigger) trigger.blur(); // Focus back on your GitHub page
            window.focus();
        }, 3000);
    }
</script>
</body>
</html>
